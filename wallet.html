<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World - 錢包</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; }
        
        body {
            background-color: #5ce1e6;
            background-image: url('https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled338_20260812133205.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #212529;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 90px;
        }

        .clouds-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: url('https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled338_20260812133205.png');
            background-repeat: repeat-x;
            background-size: contain;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
        }

        .fullscreen-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 14px;
            box-shadow: 0 5px 0px #000000;
            padding: 12px 18px;
        }

        .logo-img {
            max-width: 120px;
            width: 100%;
            height: auto;
            filter: drop-shadow(2px 2px 0px #000);
        }

        .wallet-card {
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 14px;
            box-shadow: 0 5px 0px #000000;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
        }

        .wallet-title {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
        }

        .coin-icon-img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            filter: drop-shadow(2px 2px 0px #000);
        }

        .coin-display {
            font-size: 28px;
            font-weight: 900;
            color: #000;
        }

        .wallet-info {
            font-size: 13px;
            font-weight: 700;
            color: #555;
            margin: 0;
            line-height: 1.4;
        }

        /* Fixed Bottom Navigation Bar matching home.html style */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            box-shadow: 0 -4px 0px #000000;
            border-top: 3px solid #000000;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            text-decoration: none;
            transition: transform 0.1s ease;
        }

        .nav-item img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        .nav-create-item {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
            bottom: 2.5px;
            transition: transform 0.1s ease;
        }

        .nav-create-item img {
            height: 68px;
            width: auto;
            object-fit: contain;
        }

        .nav-item:active, .nav-create-item:active {
            transform: scale(0.92);
        }

        /* Popup Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: #ffffff;
            border: 3px solid #000;
            border-radius: 14px;
            box-shadow: 5px 5px 0px #000;
            width: 100%;
            max-width: 360px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 900;
            margin: 0;
        }

        .modal-text {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin: 0;
            line-height: 1.4;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #000;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            transition: transform 0.1s ease;
        }

        .modal-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
        }

        .btn-cancel { background: #ff6b6b; color: #fff; }
        .btn-confirm { background: #55ff55; color: #000; }
    </style>
</head>
<body onload="initWallet()">

    <div class="clouds-bg"></div>

    <div class="fullscreen-container">
        <div class="nav-row">
            <img src="Devworldlogobeta.png" alt="Dev World" class="logo-img">
        </div>

        <div class="wallet-card">
            <h2 class="wallet-title">錢包</h2>
            <img src="devcoin.png" alt="代幣" class="coin-icon-img">
            <div class="coin-display" id="coin-balance">
                載入中...
            </div>
            <p class="wallet-info">當玩家造訪並遊玩你所建立的遊戲時，即可賺取 Dev 代幣！</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar: Wallet -> Posts -> Create (centered & floating) -> Profile -->
    <nav class="bottom-nav">
        <a href="wallet.html" class="nav-item">
            <img src="wallet.png" alt="錢包">
        </a>
        <a href="posts.html" class="nav-item">
            <img src="posts.png" alt="貼文">
        </a>
        <button type="button" class="nav-create-item" onclick="openCreateModal()">
            <img src="create.png" alt="建立">
        </button>
        <a href="profile.html" class="nav-item">
            <img src="profile.png" alt="個人檔案">
        </a>
    </nav>

    <!-- Create Confirmation Popup Modal -->
    <div class="modal-overlay" id="createModal">
        <div class="modal-box">
            <h3 class="modal-title">建立遊戲</h3>
            <p class="modal-text">要建立新遊戲嗎？一旦發布，此遊戲將對 Dev World 上的所有人公開。</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeCreateModal()">取消</button>
                <button class="modal-btn btn-confirm" onclick="confirmCreate()">確認</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCzjI_B6WrMpnH9bD8jfezcYbVJt3qdLKA",
            authDomain: "devworldcn.firebaseapp.com",
            projectId: "devworldcn",
            storageBucket: "devworldcn.firebasestorage.app",
            messagingSenderId: "1078417025797",
            appId: "1:1078417025797:web:b52a825d5a3b0b182b656c",
            measurementId: "G-BMRTW2FG75"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();
        db.settings({ experimentalForceLongPolling: true });
        const auth = firebase.auth();

        async function initWallet() {
            const coinDisplay = document.getElementById('coin-balance');

            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    coinDisplay.innerText = "0";
                    return;
                }

                try {
                    const userDoc = await db.collection("users").doc(user.uid).get();
                    let coins = 0;

                    if (userDoc.exists && userDoc.data().devCoins !== undefined) {
                        coins = userDoc.data().devCoins;
                    } else if (userDoc.exists && userDoc.data().coins !== undefined) {
                        coins = userDoc.data().coins;
                    } else {
                        const gamesSnap = await db.collection("games").where("authorId", "==", user.uid).get();
                        gamesSnap.forEach(doc => {
                            const data = doc.data();
                            coins += (data.visits || 0);
                        });
                    }

                    coinDisplay.innerText = coins;
                } catch (error) {
                    console.error("取得錢包資料時發生錯誤：", error);
                    coinDisplay.innerText = "錯誤";
                }
            });
        }

        function openCreateModal() {
            document.getElementById('createModal').style.display = 'flex';
        }

        function closeCreateModal() {
            document.getElementById('createModal').style.display = 'none';
        }

        function confirmCreate() {
            window.location.href = 'editor.html';
        }
    </script>
</body>
</html>
