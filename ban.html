    <style>

        body, html {

        .clouds-bg {

            max-width: 200px;
            width: 70%;

            filter: none;
        }

        .ban-text {

            color: #000000;
            text-shadow: 2px 2px 0px #ffffff;
            letter-spacing: 1px;
            margin: 0;
        }

        .btn-logout {

            max-width: 220px;
            padding: 12px;
            background: #5ce1e6;
            color: #000000;
            border: 4px solid #000000;
            border-radius: 20px;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
            font-size: 20px;

            cursor: pointer;
            box-shadow: 0 4px 0px #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
