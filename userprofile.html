<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創作者 - Dev World 搜尋</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #5ce1e6;
            background-image: url('https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/Untitled338_20260812133205.png?raw=true');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #212529;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .clouds-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: url('https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/Untitled338_20260812133205.png?raw=true');
            background-repeat: repeat-x;
            background-size: contain;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 20px;
            box-shadow: 0 8px 0px #000000;
            padding: 25px 20px;
            text-align: left;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s ease;
        }

        .profile-pfp-container {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            border: 3px solid #000;
            overflow: hidden;
            margin: 0 auto 10px auto;
            background: #f8f9fa;
            box-shadow: 2px 2px 0px #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-pfp-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-img {
            max-width: 120px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 10px auto;
            filter: drop-shadow(3px 3px 0px #000);
        }

        .header-title {
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            margin: 0 0 5px 0;
        }

        .uid-badge {
            text-align: center;
            font-size: 10px;
            font-family: monospace;
            background: #e9ecef;
            border: 1px dashed #000;
            padding: 3px 6px;
            border-radius: 6px;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .social-stats {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 5px;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
        }

        .social-stats span {
            font-weight: 600;
            font-size: 10px;
            color: #555;
        }

        .label-title {
            font-size: 10px;
            font-weight: 800;
            display: block;
            margin-bottom: 2px;
        }

        .info-box {
            width: 100%;
            padding: 6px 10px;
            border: 2px solid #000;
            border-radius: 8px;
            background: #f8f9fa;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 12px;
            min-height: 30px;
            word-break: break-word;
        }

        .section-header {
            font-size: 11px;
            font-weight: 900;
            margin: 2px 0 4px 0;
            text-transform: uppercase;
        }

        .games-container {
            flex: 1;
            overflow-y: auto;
            max-height: 90px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 8px;
            padding-right: 4px;
        }

        .game-item-card {
            background: #fdfdfd;
            border: 2px solid #000;
            padding: 5px 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #000;
            font-weight: bold;
            font-size: 11px;
            box-shadow: 2px 2px 0px #000;
            transition: transform 0.1s ease;
        }

        .game-item-card:hover {
            background: #f1f5f9;
            transform: translate(-1px, -1px);
        }

        .ban-warning-container {
            background: #fff3cd;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 6px 8px;
            text-align: center;
            margin-bottom: 8px;
        }

        .ban-warning-banner {
            max-width: 50px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 4px auto;
        }

        .ban-warning-text {
            font-size: 10px;
            font-weight: bold;
            color: #000;
            margin: 0;
            line-height: 1.3;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
        }

        .btn-custom {
            width: 100%;
            padding: 8px;
            border: 2px solid #000;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            transition: transform 0.1s ease;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 6px;
        }

        .btn-custom:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .btn-follow { background: #55ff55; color: #000; }
        .btn-unfollow { background: #ffbe0b; color: #000; }
        .btn-back { background: #ff595e; color: #fff; margin-bottom: 0; }
    </style>
</head>
<body onload="initProfile()">

    <div class="clouds-bg"></div>

    <div id="main-profile-container" class="main-container">
        <!-- Profile Picture Display -->
        <div class="profile-pfp-container">
            <img id="profile-pfp-display" src="people.png" alt="個人頭像" class="profile-pfp-img" onerror="this.src='https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/people.png'">
        </div>

        <img src="Devworldlogobeta.png" alt="Dev World 標誌" class="logo-img">
        
        <h3 id="profile-username" class="header-title">正在載入使用者...</h3>
        <div id="uid-display" class="uid-badge">ID：載入中...</div>
        
        <div class="social-stats">
            <div><div id="followers-count">0</div><span>粉絲</span></div>
            <div><div id="following-count">0</div><span>正在追蹤</span></div>
        </div>

        <label class="label-title">個人簡介</label>
        <div id="profile-bio" class="info-box">正在載入簡介...</div>
        
        <button id="follow-btn" class="btn-custom btn-follow" onclick="toggleFollow()">追蹤</button>

        <div class="section-header">已發布的遊戲</div>
        <div class="games-container" id="user-games-list">
            <div style="font-size: 12px; color: #666; text-align: center; padding: 10px;">正在載入遊戲...</div>
        </div>

        <a href="home.html" class="btn-custom btn-back">返回</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCzjI_B6WrMpnH9bD8jfezcYbVJt3qdLKA",
            authDomain: "devworldcn.firebaseapp.com",
            projectId: "devworldcn",
            storageBucket: "devworldcn.firebasestorage.app",
            messagingSenderId: "1078417025797",
            appId: "1:1078417025797:web:b52a825d5a3b0b182b656c",
            measurementId: "G-BMRTW2FG75"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();
        db.settings({ experimentalForceLongPolling: true });
        let targetUserId = "";
        let targetUsername = "";
        let isFollowing = false;
        let profileUnsubscribe = null;

        async function initProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            let targetIdentifier = urlParams.get('id');

            if (!targetIdentifier) {
                document.getElementById("profile-username").innerText = "找不到使用者";
                document.getElementById("uid-display").innerText = "查詢中未指定 ID。";
                document.getElementById("profile-bio").innerText = "請提供有效的使用者連結。";
                document.getElementById("user-games-list").innerHTML = "";
                return;
            }

            try {
                let initialDoc = null;

                try {
                    const directDoc = await db.collection("users").doc(targetIdentifier).get();
                    if (directDoc.exists) {
                        initialDoc = directDoc;
                        targetUserId = directDoc.id;
                    }
                } catch (e) {
                    console.log("直接查詢備用方案已啟動");
                }

                if (!initialDoc || !initialDoc.exists) {
                    const allUsersSnap = await db.collection("users").get();
                    const targetLower = targetIdentifier.toLowerCase();
                    
                    allUsersSnap.forEach(doc => {
                        const dData = doc.data();
                        const uName = (dData.Username || dData.username || "").toLowerCase();
                        if (doc.id === targetIdentifier || uName === targetLower) {
                            initialDoc = doc;
                            targetUserId = doc.id;
                        }
                    });
                }

                if (!targetUserId) {
                    document.getElementById("profile-username").innerText = "未知創作者";
                    document.getElementById("uid-display").innerText = "ID：" + targetIdentifier;
                    document.getElementById("profile-bio").innerText = "此使用者個人檔案不存在。";
                    document.getElementById("user-games-list").innerHTML = "";
                    return;
                }

                // Check auth and determine follow status right away
                firebase.auth().onAuthStateChanged(async (currentUser) => {
                    if (currentUser) {
                        if (currentUser.uid === targetUserId) {
                            document.getElementById("follow-btn").style.display = "none";
                            return;
                        }

                        try {
                            const mySnap = await db.collection("users").doc(currentUser.uid).get();
                            if (mySnap.exists) {
                                const myFollowing = Array.isArray(mySnap.data().following) ? mySnap.data().following : [];
                                if (myFollowing.includes(targetUserId)) {
                                    isFollowing = true;
                                    const followBtn = document.getElementById("follow-btn");
                                    followBtn.innerText = "已追蹤";
                                    followBtn.className = "btn-custom btn-unfollow";
                                }
                            }
                        } catch (err) {
                            console.log("檢查追蹤狀態時發生錯誤：", err);
                        }
                    }
                });

                // Real-time listener for target user profile
                if (profileUnsubscribe) profileUnsubscribe();
                profileUnsubscribe = db.collection("users").doc(targetUserId).onSnapshot(async (docSnap) => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        targetUsername = data.Username || data.username || "DevWorldUser";
                        
                        document.getElementById("profile-username").innerText = targetUsername;
                        document.getElementById("uid-display").innerText = "ID：" + targetUserId;
                        document.getElementById("profile-bio").innerText = data.Bio || data.bio || "尚未新增個人簡介。";

                        // Apply profile color if set
                        if (data.profileColor) {
                            document.getElementById("main-profile-container").style.backgroundColor = data.profileColor;
                        }

                        // Set profile picture or default to people.png
                        const pfpImg = document.getElementById("profile-pfp-display");
                        if (data.pfpUrl && data.pfpUrl.trim() !== "") {
                            pfpImg.src = data.pfpUrl;
                        } else {
                            pfpImg.src = "people.png";
                        }

                        const followersList = Array.isArray(data.followers) ? data.followers : (Array.isArray(data.Followers) ? data.Followers : []);
                        const followingList = Array.isArray(data.following) ? data.following : (Array.isArray(data.Following) ? data.Following : []);
                        
                        document.getElementById("followers-count").innerText = followersList.length;
                        document.getElementById("following-count").innerText = followingList.length;

                        // Check if user is banned or devPoints <= 79
                        const devPoints = data.devPoints !== undefined ? data.devPoints : 100;
                        const isBanned = data.isBanned === true || devPoints <= 79;

                        const gamesListEl = document.getElementById("user-games-list");

                        if (isBanned) {
                            gamesListEl.innerHTML = `
                                <div class="ban-warning-container">
                                    <img src="bannedwarning.png" alt="封鎖警告" class="ban-warning-banner" onerror="this.src='https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/logo1.png?raw=true'">
                                    <p class="ban-warning-text">此使用者已被封鎖。他們無法再在此帳號上使用 <b>Dev World</b>。</p>
                                </div>
                            `;
                        } else {
                            // Load user games
                            gamesListEl.innerHTML = "";
                            const allGamesSnapshot = await db.collection("games").get();
                            let matchedGames = [];

                            allGamesSnapshot.forEach(gDoc => {
                                const game = gDoc.data();
                                const gameAuthorId = game.authorId || game.creatorId || game.userId;
                                if (gameAuthorId === targetUserId) {
                                    matchedGames.push({ id: gDoc.id, ...game });
                                }
                            });

                            if (matchedGames.length === 0) {
                                gamesListEl.innerHTML = '<div style="font-size: 12px; color: #666; text-align: center; padding: 10px;">尚未發布任何遊戲。</div>';
                                return;
                            }

                            matchedGames.forEach(game => {
                                const card = document.createElement('a');
                                card.className = 'game-item-card';
                                card.href = `play.html?id=${game.id}`;
                                
                                const titleSpan = document.createElement('span');
                                titleSpan.innerText = game.title || "未命名關卡";

                                const badgeSpan = document.createElement('span');
                                badgeSpan.style.fontSize = '10px';
                                badgeSpan.style.background = '#e9ecef';
                                badgeSpan.style.padding = '2px 6px';
                                badgeSpan.style.borderRadius = '4px';
                                badgeSpan.innerText = '遊玩 ▶';

                                card.appendChild(titleSpan);
                                card.appendChild(badgeSpan);
                                gamesListEl.appendChild(card);
                            });
                        }
                    }
                });

            } catch (error) {
                console.error("載入使用者個人檔案時發生錯誤：", error);
                document.getElementById("profile-username").innerText = "錯誤";
                document.getElementById("profile-bio").innerText = "無法取得使用者記錄。";
            }
        }

        async function toggleFollow() {
            const currentUser = firebase.auth().currentUser;
            
            if (!currentUser) {
                alert("請登入或建立帳號以追蹤使用者。");
                return;
            }

            const myRef = db.collection("users").doc(currentUser.uid);
            const targetRef = db.collection("users").doc(targetUserId);
            const followBtn = document.getElementById("follow-btn");

            try {
                const mySnap = await myRef.get();
                const targetSnap = await targetRef.get();

                let myFollowing = (mySnap.exists && Array.isArray(mySnap.data().following)) ? mySnap.data().following : [];
                let targetFollowers = (targetSnap.exists && Array.isArray(targetSnap.data().followers)) ? targetSnap.data().followers : [];

                if (isFollowing) {
                    myFollowing = myFollowing.filter(id => id !== targetUserId);
                    targetFollowers = targetFollowers.filter(id => id !== currentUser.uid);

                    isFollowing = false;
                    followBtn.innerText = "追蹤";
                    followBtn.className = "btn-custom btn-follow";
                } else {
                    if (!myFollowing.includes(targetUserId)) myFollowing.push(targetUserId);
                    if (!targetFollowers.includes(currentUser.uid)) targetFollowers.push(currentUser.uid);

                    isFollowing = true;
                    followBtn.innerText = "已追蹤";
                    followBtn.className = "btn-custom btn-unfollow";
                    
                    alert(`你已追蹤 ${targetUsername}`);
                }

                // Explicitly merge data to force creation of the fields if they completely missed them before
                await myRef.set({ following: myFollowing }, { merge: true });
                await targetRef.set({ followers: targetFollowers }, { merge: true });

            } catch (err) {
                console.error("更新追蹤狀態時發生錯誤：", err);
                alert("更新追蹤狀態失敗。請檢查主控台以取得詳細資料。");
            }
        }
    </script>
</body>
</html>
