<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World v0.2.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #87f2b7;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
        }

        .mobile-app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            background-color: #87f2b7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-y: auto;
            border: none;
            box-shadow: none;
            padding: 20px 10px;
        }

        .clouds-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/Untitled338_20260812133205.png?raw=true');
            background-repeat: repeat;
            background-size: 400px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 1;
        }

        .top-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 4vh;
        }

        .logo-img {
            max-width: 220px;
            width: 80%;
            height: auto;
            margin-bottom: 5px;
            filter: drop-shadow(3px 3px 0px #000);
        }

        .version-text {
            font-size: 15px;
            letter-spacing: 1px;
            color: #000;
        }

        .center-container {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 2vh;
        }

        .btn-start {
            width: 100%;
            max-width: 260px;
            padding: 12px;
            background: #cceecc;
            color: #000000;
            border: 4px solid #000000;
            border-radius: 20px;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
            font-size: 22px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 0px #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            text-align: center;
        }

        .btn-start:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #000000;
        }

        .footer-scene {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            margin-bottom: 1vh;
        }

        .footer-img {
            width: 85%;
            height: auto;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div class="mobile-app-container">
        <div class="clouds-bg"></div>

        <div class="top-container">
            <img src="https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/logo1.png?raw=true" alt="Dev World Logo" class="logo-img" onerror="this.src='Devworldlogobeta.png'">
            <div class="version-text">v0.2.0</div>
        </div>

        <div class="center-container">
            <button id="open-start-btn" class="btn-start">開始！</button>
        </div>

        <div class="footer-scene">
            <img src="https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/screenlogin1.png?raw=true" alt="角色與場景" class="footer-img">
        </div>
    </div>

    <!-- 載入自定義 Dev World 引擎 -->
    <script src="devworldeng.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCzjI_B6WrMpnH9bD8jfezcYbVJt3qdLKA",
            authDomain: "devworldcn.firebaseapp.com",
            projectId: "devworldcn",
            storageBucket: "devworldcn.firebasestorage.app",
            messagingSenderId: "1078417025797",
            appId: "1:1078417025797:web:b52a825d5a3b0b182b656c",
            measurementId: "G-BMRTW2FG75"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
    </script>

    <script>
        const firebaseConfigV8 = {
            apiKey: "AIzaSyCzjI_B6WrMpnH9bD8jfezcYbVJt3qdLKA",
            authDomain: "devworldcn.firebaseapp.com",
            projectId: "devworldcn",
            storageBucket: "devworldcn.firebasestorage.app",
            messagingSenderId: "1078417025797",
            appId: "1:1078417025797:web:b52a825d5a3b0b182b656c"
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfigV8);
        }

        const db = firebase.firestore();
        db.settings({ experimentalForceLongPolling: true });

        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
            .catch((error) => {
                console.warn("驗證持久性錯誤：", error.message);
            });

        function handleUserRedirect(user) {
            db.collection("users").doc(user.uid).get().then((doc) => {
                if (doc.exists && doc.data().isBanned === true) {
                    window.location.href = "ban.html";
                } else {
                    window.location.href = "profile.html";
                }
            }).catch((error) => {
                console.error("檢查使用者狀態時發生錯誤：", error);
                window.location.href = "profile.html";
            });
        }

        document.getElementById('open-start-btn').addEventListener('click', () => {
            const currentUser = firebase.auth().currentUser;
            if (currentUser) {
                handleUserRedirect(currentUser);
                return;
            }

            dev.createpopup({
                title: "歡迎來到 Dev World",
                buttons: {
                    "btn-create": {
                        text: "建立帳號",
                        color: "#5ce1e6",
                        textColor: "#000000",
                        onClick: () => openSignupPopup()
                    },
                    "btn-login": {
                        text: "登入",
                        color: "#5ce1e6",
                        textColor: "#000000",
                        onClick: () => openLoginPopup()
                    }
                }
            });
        });

        // Helper function to convert any username (Chinese or English) into a 100% valid Firebase Auth email
        function getSyntheticEmail(username) {
            const clean = encodeURIComponent(username.trim().toLowerCase()).replace(/%/g, 'x');
            return `${clean}@devworld.local`;
        }

        function openSignupPopup() {
            dev.createpopup({
                title: "建立帳號",
                inputs: {
                    "signup-username": { type: "text", placeholder: "使用者名稱" },
                    "signup-pass": { type: "password", placeholder: "密碼" }
                },
                buttons: {
                    "btn-signup": {
                        text: "註冊",
                        color: "#38b000",
                        textColor: "#fff",
                        onClick: () => {
                            const username = document.getElementById("signup-username").value.trim();
                            const pass = document.getElementById("signup-pass").value;

                            if (!username) {
                                alert("請輸入使用者名稱。");
                                document.getElementById("signup-username").focus();
                                return;
                            }
                            if (!pass) {
                                alert("請輸入密碼。");
                                return;
                            }

                            const syntheticEmail = getSyntheticEmail(username);

                            firebase.auth().createUserWithEmailAndPassword(syntheticEmail, pass)
                            .then((userCredential) => {
                                const user = userCredential.user;
                                return db.collection("users").doc(user.uid).set({
                                    Username: username,
                                    Bio: "什麼都沒有... :/",
                                    Projects: [],
                                    isBanned: false
                                }, { merge: true }).then(() => {
                                    handleUserRedirect(user);
                                });
                            })
                            .catch((error) => {
                                let errorMsg = error.message;
                                if (error.code === 'auth/email-already-in-use') {
                                    errorMsg = "這個使用者名稱已經被使用了。";
                                } else if (error.code === 'auth/weak-password') {
                                    errorMsg = "密碼強度太弱，請至少輸入 6 個字元。";
                                }
                                alert("錯誤：" + errorMsg);
                            });
                        }
                    }
                }
            });
        }

        function openLoginPopup() {
            dev.createpopup({
                title: "登入帳號",
                inputs: {
                    "login-username": { type: "text", placeholder: "使用者名稱" },
                    "login-pass": { type: "password", placeholder: "密碼" }
                },
                buttons: {
                    "btn-login": {
                        text: "登入",
                        color: "#38b000",
                        textColor: "#fff",
                        onClick: () => {
                            const username = document.getElementById("login-username").value.trim();
                            const pass = document.getElementById("login-pass").value;

                            if (!username || !pass) {
                                alert("請同時輸入使用者名稱和密碼。");
                                return;
                            }

                            const syntheticEmail = getSyntheticEmail(username);

                            firebase.auth().signInWithEmailAndPassword(syntheticEmail, pass)
                            .then((userCredential) => {
                                handleUserRedirect(userCredential.user);
                            })
                            .catch((error) => {
                                let errorMsg = error.message;
                                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                                    errorMsg = "使用者名稱或密碼錯誤。";
                                } else if (error.code === 'auth/invalid-email') {
                                    errorMsg = "使用者名稱格式無效。";
                                }
                                alert("錯誤：" + errorMsg);
                            });
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
